services:
  # App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ci4_app
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - ci4_network

  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: ci4_webserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ci4_network

  # Database (MySQL 8.0 / 5.7)
  db:
    image: mysql:8.0
    container_name: ci4_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - ci4_network

  # Database Management (Adminer)
  adminer:
    image: adminer:latest
    container_name: ci4_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - ci4_network

networks:
  ci4_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
